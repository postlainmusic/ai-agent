name: Antigravity Worker

on:
  push:
    paths:
      - 'tasks/inbox/*.json'
      - 'worker.py'
      - 'requirements.txt'
      - '.github/workflows/antigravity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Google Antigravity
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python worker.py

      - name: Publish result
        run: |
          git config user.name "ai-agent[bot]"
          git config user.email "ai-agent[bot]@users.noreply.github.com"
          git add tasks/results
          git diff --cached --quiet || git commit -m "chore: publish Antigravity result"
          git push
