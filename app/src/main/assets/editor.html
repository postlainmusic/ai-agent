<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
:root{--bg:#08090c;--text:#e8eaf0;--muted:#5f6675;--violet:#9b8cff;--cyan:#72d7ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#editor{height:100%;overflow:auto;padding:16px 0 120px;font-size:13px;line-height:1.75;outline:none;white-space:pre;tab-size:4;-webkit-overflow-scrolling:touch;caret-color:var(--violet)}
.line{display:block;min-height:23px;padding:0 16px 0 58px;position:relative}.line:before{counter-increment:line;content:counter(line,decimal-leading-zero);position:absolute;left:16px;width:27px;text-align:right;color:var(--muted);user-select:none}
.kw{color:var(--violet)}.str{color:var(--cyan)}.cm{color:#596071}
</style></head><body><div id="editor" contenteditable="true" spellcheck="false"></div><script>
let plain='';
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function paint(s){let x=esc(s);x=x.replace(/(\/\/.*)$/g,'<span class="cm">$1</span>');x=x.replace(/\b(class|override|fun|val|var|return|import|package|private|public|object|interface)\b/g,'<span class="kw">$1</span>');x=x.replace(/("[^"\\]*(?:\\.[^"\\]*)*")/g,'<span class="str">$1</span>');return x}
function render(text){plain=text;document.getElementById('editor').innerHTML=text.split('\n').map(l=>`<span class="line">${paint(l)||' '}</span>`).join('')}
function getEditorContent(){return document.getElementById('editor').innerText.replace(/\u00a0/g,' ')}
function setEditorContent(text){render(text||'')}
function save(){if(window.Native){window.Native.save(getEditorContent())}}
const ed=document.getElementById('editor');
ed.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();document.execCommand('insertText',false,'    ')}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save()}});
ed.addEventListener('input',()=>{plain=getEditorContent()});
render('// Select a file from the project tree.');
</script></body></html>
